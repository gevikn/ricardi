# Deploying to the box, from anywhere with `gh` and no session on the box.
#
#   gh workflow run deploy.yml -f ref=main
#   gh run watch
#
# It runs on a self-hosted runner *on* the box, which matters for two reasons
# beyond cost. The runner dials out to GitHub, so this needs no inbound port --
# the same shape as Socket Mode and the cloudflared tunnel, and the reason this
# works at all on a machine behind a home router. And the image is built where
# it is used, so there is no registry in the path and the layer cache survives
# between deploys.
#
# SECURITY, and it is not a footnote: a self-hosted runner executes whatever
# the triggering workflow file says, as the runner's user. That is fine for a
# private repository whose collaborators you would hand a shell to anyway. It
# is NOT fine for a public one -- a pull request from a fork would run on this
# machine.
#
# The control is structural rather than remembered: no untrusted event may name
# a self-hosted runner, and `tests/test_workflow_trust.py` asserts that on every
# run. Keep this workflow on trusted triggers only and the guard will fail the
# build if it ever drifts. Do not substitute fork-approval settings for it --
# the "first-time contributor" exemption lets anyone through once they have had
# a single commit merged.
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        default: main
      skip_test_gate:
        description: "Deploy even if tests did not pass on that commit"
        type: boolean
        default: false

# One deploy at a time. Two interleaved rebuilds of the same compose project
# is how you end up with a container running an image nobody can name.
# Only what the test gate needs: read the tests workflow's conclusion on a
# commit. Nothing here writes to the repository.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-ricardi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ricardi-home]
    env:
      DEPLOY_DIR: /opt/ricardi
      GH_TOKEN: ${{ github.token }}
      TARGET_REF: ${{ inputs.ref }}

    steps:
      # No actions/checkout. The deployment directory IS the working copy, and
      # it holds the things that must not be replaced: .env, policy.toml,
      # agents.toml and state/ are all untracked and all irreplaceable.
      - name: Fetch, and say what we are about to deploy
        id: target
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          git fetch --prune origin
          sha=$(git rev-parse --verify "origin/${TARGET_REF}^{commit}" 2>/dev/null \
                || git rev-parse --verify "${TARGET_REF}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "was=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"
          git log --oneline -1 "$sha"

      - name: Require that the tests passed on that exact commit
        if: ${{ !inputs.skip_test_gate }}
        run: |
          set -euo pipefail
          sha='${{ steps.target.outputs.sha }}'
          # Wait for a verdict rather than take the absence of one for an
          # answer. A rebase-merge produces a SHA no pull-request check ever
          # ran against, so the only run that can satisfy this gate is the
          # `push: [main]` run the merge itself starts -- and for its first
          # minute that run has a status and no conclusion. Reading it as "no
          # run" refuses a healthy deploy and reports the tests as 'none',
          # which sends you looking for a run that is in fact running.
          #
          # Bounded by attempts rather than by the clock: 45 tries, 20s apart.
          verdict=none
          for _ in $(seq 1 45); do
            verdict=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
              | jq -r '[.workflow_runs[] | select(.name == "tests")]
                       | sort_by(.created_at) | last
                       | if . == null then "none" else (.conclusion // .status) end')
            case "$verdict" in
              queued|in_progress|pending|waiting|requested|action_required)
                echo "tests on $sha: $verdict -- waiting"
                sleep 20
                ;;
              *) break ;;
            esac
          done
          echo "tests on $sha: $verdict"
          if [ "$verdict" != "success" ]; then
            echo "::error::Refusing to deploy $sha -- the tests workflow is '$verdict' on it."
            case "$verdict" in
              queued|in_progress|pending|waiting|requested|action_required)
                echo "Still '$verdict' after about fifteen minutes. Look at the run"
                echo "itself, then start this deploy again -- nothing has changed yet."
                ;;
              none)
                echo "No tests run exists for that SHA at all. Push it, or run"
                echo "'gh workflow run tests.yml --ref <branch>' first."
                ;;
              *)
                echo "A deployer that merely follows a branch will ship a commit whose"
                echo "tests failed. Re-run deploy with skip_test_gate if you mean to."
                ;;
            esac
            exit 1
          fi

      - name: Keep a way back
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Tag what is running now. Rebuilding replaces the image under the
          # same name, so without this there is nothing to go back to.
          if docker image inspect ricardi-ricardi >/dev/null 2>&1; then
            docker image tag ricardi-ricardi ricardi-ricardi:rollback
            echo "tagged the running image as :rollback"
          else
            echo "no existing image; this is a first deploy"
          fi

      - name: Move the working copy
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # checkout, not reset --hard: a dirty tracked file is a signal that
          # someone changed something on the box, and silently discarding it
          # is how that person stops trusting this pipeline.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked files are modified in $DEPLOY_DIR. Deal with"
            echo "them on the box first -- this will not throw away your edit."
            git status --short
            exit 1
          fi
          git checkout --detach '${{ steps.target.outputs.sha }}'
          git log --oneline -1

      - name: Build and restart
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # The container runs as the invoking uid, so pass it explicitly --
          # UID is readonly in bash and does not survive into compose.
          env UID="$(id -u)" GID="$(id -g)" docker compose up -d --build

      - name: Is it actually up
        id: health
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Not the log. This box's container log loses its newest lines
          # within minutes, so grepping it answers "is it up" either with a
          # previous boot's word -- an unbounded --tail cannot tell the two
          # apart -- or with nothing at all, on a container that is fine.
          # The process writes state/ready.json once it is actually serving,
          # and state/ is a bind mount, so it arrives here with no log driver
          # anywhere in the path.
          cid=$(docker compose ps -q ricardi)
          if [ -z "$cid" ]; then
            echo "::error::No ricardi container after the build."
            exit 1
          fi
          # Anchored on the container, not on this deploy. An unchanged image
          # is not recreated, so a no-op deploy writes no new marker -- and a
          # gate that demanded one would fail the deploy that changed nothing.
          started=$(date -u -d "$(docker inspect -f '{{.State.StartedAt}}' "$cid")" +%s)
          ok=no
          stamp=""
          for _ in $(seq 1 30); do
            state=$(docker compose ps --format '{{.Service}} {{.State}}' | awk '$1=="ricardi"{print $2}')
            if [ "$state" = "running" ] && [ -f state/ready.json ]; then
              # An absent stamp has to count as no stamp. `date -u -d ""` is
              # not an error -- it is midnight today -- so handing it an empty
              # value yields a real time, and on a deploy run just after
              # midnight UTC that time sits AFTER a container started the
              # evening before. Which is exactly the no-op deploy.
              stamp=$(jq -r '.connected_at // empty' state/ready.json 2>/dev/null || true)
              connected=0
              if [ -n "$stamp" ]; then
                connected=$(date -u -d "$stamp" +%s 2>/dev/null || echo 0)
              fi
              if [ "$connected" -ge "$started" ]; then
                ok=yes
                break
              fi
            fi
            sleep 2
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          docker compose ps
          if [ "$ok" != "yes" ]; then
            echo "::error::No readiness marker at or after this container started."
            echo "marker:"
            cat state/ready.json 2>/dev/null || echo "  (none written)"
            # Unreliable as a decision, still the first thing a person reads.
            docker compose logs --tail 60 ricardi || true
            exit 1
          fi
          echo "ready since $stamp"

      - name: Put it back the way it was
        if: failure() && steps.health.outcome == 'failure'
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if docker image inspect ricardi-ricardi:rollback >/dev/null 2>&1; then
            git checkout --detach '${{ steps.target.outputs.was }}'
            docker image tag ricardi-ricardi:rollback ricardi-ricardi
            env UID="$(id -u)" GID="$(id -g)" docker compose up -d
            echo "::warning::Rolled back to ${{ steps.target.outputs.was }}"
            docker compose ps
          else
            echo "::error::No :rollback image. The box needs hands."
          fi

      - name: Say what happened
        if: always()
        run: |
          cd "$DEPLOY_DIR"
          {
            echo "### Deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| requested | \`${TARGET_REF}\` |"
            echo "| commit | \`${{ steps.target.outputs.sha }}\` |"
            echo "| previous | \`${{ steps.target.outputs.was }}\` |"
            echo "| now running | \`$(git rev-parse HEAD)\` |"
            echo "| healthy | ${{ steps.health.outputs.ok || 'no' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
