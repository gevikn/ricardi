name: tests

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be started deliberately -- to re-run a flake without an empty
  # commit, or to prove a branch green before deploying it.
  #   gh workflow run tests.yml --ref <branch>
  workflow_dispatch:

# Read-only by default. A public repository hands this token to every fork's
# pull request build, so the less it carries the better.
permissions:
  contents: read

jobs:
  offline:
    # The shell tool is named differently per platform and policy rules match on
    # that name, so both are tested. A green run on one proves little.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e ".[slack,sdk]" pytest pytest-asyncio pyyaml
      # No tokens, no network, no Slack. The live suite is opt-in and never
      # runs here: it starts real Claude Code sessions and spends real money.
      - run: uv run pytest -q

  examples:
    # The shipped example files are what people copy, so they are checked as
    # artefacts rather than trusted as prose.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv
      - run: uv pip install -e ".[sdk]" pytest pytest-asyncio pyyaml
      - run: uv run pytest -q tests/test_policy.py tests/test_policy_limits.py -k example
