# Rotating the Anthropic key without a shell on the box.
#
#   gh secret set ANTHROPIC_API_KEY -R <owner>/<repo>      # paste the new key
#   gh workflow run rotate-credential.yml && gh run watch
#
# The key lives in /opt/ricardi/.env, which `deploy.yml` deliberately never
# touches -- that file holds the things no deploy may replace. So rotation was
# the one routine task that still needed an interactive session on the box,
# which on a machine behind a home router means the tunnel has to be working
# on the day the credential dies. That is the wrong dependency: a dead
# credential and a dead tunnel have the same cause more often than not.
#
# This runs on the same self-hosted runner as the deploy, which dials out, so
# it needs nothing listening and no session on the box.
#
# WHAT IT DOES NOT DO: mint the key. Creating and revoking keys is a Console
# action, and this workflow never sees the old one. The sequence is: create
# the new key in the Console, set the secret, run this, then revoke the old
# key once Slack answers.
#
# SECURITY. This workflow is why the repository holds a secret at all, and a
# public repository with a self-hosted runner has to be careful about that.
# Two structural rules, both asserted by tests/test_workflow_trust.py on every
# run:
#
#   1. workflow_dispatch only. No push, no schedule. The credential reaches
#      the runner because a person with write access pressed a button.
#   2. The secret travels in `env:`, never interpolated into a `run:` body --
#      `${{ }}` is substituted before the shell exists, which would bake the
#      value into the script on disk.
#
# Fork pull requests cannot reach this: they cannot dispatch a workflow, and
# GitHub does not give a fork's workflow run the base repository's secrets.
name: rotate-credential

on:
  workflow_dispatch:
    inputs:
      allow_add:
        description: "Write the key even if .env has no ANTHROPIC_API_KEY line yet"
        type: boolean
        default: false

# Nothing here reads or writes the repository. The deploy needs `actions: read`
# for its test gate; this has no gate to read.
permissions: {}

# Shared with deploy.yml on purpose. A rebuild and a credential rewrite
# interleaving is how you get a container running with half of each.
concurrency:
  group: deploy-ricardi
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: [self-hosted, ricardi-home]
    env:
      DEPLOY_DIR: /opt/ricardi

    steps:
      - name: Is the new key even there, and does it work
        id: validate
        env:
          NEW_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_KEY:-}" ]; then
            echo "::error::The ANTHROPIC_API_KEY secret is empty or unset."
            echo "Set it first: gh secret set ANTHROPIC_API_KEY -R $GITHUB_REPOSITORY"
            exit 1
          fi
          # Ask the API before touching anything. A key that does not work is
          # a failed workflow with the box still serving, rather than a
          # restart into silence that Slack reports as nothing at all.
          #
          # The header goes in via --config on stdin rather than -H, so the
          # value is never an argument to a process anyone can see in `ps`.
          # `printf` is a shell builtin, so it exposes nothing either.
          code=$(printf 'header = "x-api-key: %s"\n' "$NEW_KEY" \
            | curl -sS -K - \
                -o /dev/null -w '%{http_code}' \
                -H 'anthropic-version: 2023-06-01' \
                'https://api.anthropic.com/v1/models?limit=1')
          echo "GET /v1/models -> $code"
          case "$code" in
            200) echo "the new key authenticates" ;;
            401|403)
              echo "::error::The new key was rejected ($code). Nothing has changed."
              echo "Check you pasted the whole key, and that it is not already revoked."
              exit 1
              ;;
            *)
              echo "::error::Could not verify the key -- the API answered $code."
              echo "That is not a verdict on the key, so nothing has changed. Try again."
              exit 1
              ;;
          esac

      - name: Refuse a configuration this key cannot win
        env:
          ALLOW_ADD: ${{ inputs.allow_add }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if [ ! -f .env ]; then
            echo "::error::No $DEPLOY_DIR/.env. This box was never installed from"
            echo "scripts/install-service.sh -- do that before rotating anything."
            exit 1
          fi
          # install-service.sh's rules, restated here because a credential that
          # is shadowed looks exactly like a credential that is wrong, and the
          # person debugging it is the one who cannot get a shell.
          if grep -Eq '^[[:space:]]*CLAUDE_CODE_OAUTH_TOKEN=[^[:space:]]' .env; then
            echo "::error::.env also sets CLAUDE_CODE_OAUTH_TOKEN. They conflict;"
            echo "keep exactly one. Remove it on the box, then rotate."
            exit 1
          fi
          # A stored login takes precedence over the environment, so it would
          # swallow this rotation silently. The directory is whatever compose
          # mounts at /config/claude, which .env may override.
          claude_dir=$(sed -n 's/^[[:space:]]*RICARDI_CLAUDE_DIR=//p' .env | tail -1)
          claude_dir=${claude_dir:-./claude-config}
          if [ -f "$claude_dir/.credentials.json" ]; then
            echo "::error::A stored Claude Code login exists at"
            echo "$claude_dir/.credentials.json, and it takes precedence over"
            echo "ANTHROPIC_API_KEY. Rotating the key would change nothing."
            exit 1
          fi
          lines=$(grep -c '^[[:space:]]*ANTHROPIC_API_KEY=' .env || true)
          echo "ANTHROPIC_API_KEY lines in .env: $lines"
          if [ "$lines" -gt 1 ]; then
            echo "::error::.env has $lines ANTHROPIC_API_KEY lines. Which one wins"
            echo "depends on how it is read, so this will not guess. Fix it on the box."
            exit 1
          fi
          if [ "$lines" -eq 0 ] && [ "${ALLOW_ADD:-false}" != "true" ]; then
            echo "::error::.env has no ANTHROPIC_API_KEY line. If this box is meant"
            echo "to use an API key, re-run with allow_add=true and one will be added."
            echo "If it is meant to use a subscription login, this is the wrong tool."
            exit 1
          fi

      - name: Write it, keeping a way back
        id: write
        env:
          NEW_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          umask 077
          # ENVIRON, not -v: an awk -v assignment is an argument, and
          # arguments are readable in `ps` for as long as the process lives.
          awk '
            BEGIN { key = ENVIRON["NEW_KEY"]; written = 0 }
            /^[[:space:]]*ANTHROPIC_API_KEY=/ {
              if (!written) { print "ANTHROPIC_API_KEY=" key; written = 1 }
              next
            }
            { print }
            END { if (!written) print "ANTHROPIC_API_KEY=" key }
          ' .env > .env.next
          # Keep the previous file as the one-step way back, at its own mode.
          cp -p .env .env.bak
          mv .env.next .env
          chmod 600 .env .env.bak
          # Say what changed without saying what it changed to.
          echo "rewrote .env: $(wc -l < .env) lines, one of them the key"
          echo "previous file kept as .env.bak"
          # The rollback step reads this. Gating it on the presence of
          # .env.bak instead would restore a *previous* rotation's file when
          # this run failed before writing anything -- turning a refusal that
          # changed nothing into a change nobody asked for.
          echo "rewrote=yes" >> "$GITHUB_OUTPUT"

      - name: Recreate the container with the new environment
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # --force-recreate because compose will not necessarily notice that
          # an env_file changed, and a rotation that silently kept the old
          # process is the failure this whole workflow exists to prevent.
          #
          # No --build, and the working copy is not moved: rotating a
          # credential must not also ship code.
          env UID="$(id -u)" GID="$(id -g)" \
            docker compose up -d --force-recreate --no-build ricardi
          docker compose ps

      - name: Is it up, and is it holding the new key
        id: health
        env:
          NEW_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Same marker and the same reasoning as deploy.yml: this box's
          # container log loses its newest lines within minutes, so the log
          # cannot answer "is it up". state/ready.json is written when the
          # process is actually serving, through a bind mount with no log
          # driver in the path.
          cid=$(docker compose ps -q ricardi)
          if [ -z "$cid" ]; then
            echo "::error::No ricardi container after the restart."
            exit 1
          fi
          started=$(date -u -d "$(docker inspect -f '{{.State.StartedAt}}' "$cid")" +%s)
          ok=no
          stamp=""
          for _ in $(seq 1 30); do
            state=$(docker compose ps --format '{{.Service}} {{.State}}' \
              | awk '$1=="ricardi"{print $2}')
            if [ "$state" = "running" ] && [ -f state/ready.json ]; then
              stamp=$(jq -r '.connected_at // empty' state/ready.json 2>/dev/null || true)
              connected=0
              if [ -n "$stamp" ]; then
                connected=$(date -u -d "$stamp" +%s 2>/dev/null || echo 0)
              fi
              if [ "$connected" -ge "$started" ]; then
                ok=yes
                break
              fi
            fi
            sleep 2
          done
          if [ "$ok" != "yes" ]; then
            echo "::error::No readiness marker at or after this container started."
            cat state/ready.json 2>/dev/null || echo "  (no marker written)"
            docker compose logs --tail 60 ricardi || true
            exit 1
          fi
          echo "connected to Slack at $stamp"

          # Readiness is not proof of the credential: a container with a dead
          # key connects to Slack perfectly and only fails on the first turn.
          # So compare what the running process holds against what we wrote --
          # by digest, computed on both sides and never printed. This is what
          # catches a container that was not really recreated, and a key that
          # something else in the environment is overriding.
          want=$(printf %s "$NEW_KEY" | sha256sum | cut -d' ' -f1)
          got=$(docker compose exec -T ricardi \
                  sh -c 'printf %s "${ANTHROPIC_API_KEY:-}" | sha256sum' \
                | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::The running process is not holding the key we just wrote."
            echo "The container may not have been recreated, or something in its"
            echo "environment is overriding .env. Rolling back."
            exit 1
          fi
          echo "the running process holds the new key"
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: Put the old key back
        if: failure() && steps.write.outputs.rewrote == 'yes'
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          if [ ! -f .env.bak ]; then
            echo "::error::.env was rewritten but .env.bak is gone. The box needs hands."
            exit 1
          fi
          mv .env.bak .env
          chmod 600 .env
          env UID="$(id -u)" GID="$(id -g)" \
            docker compose up -d --force-recreate --no-build ricardi
          echo "::warning::Rolled back to the previous .env and restarted."
          docker compose ps

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Credential rotation"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| key | \`ANTHROPIC_API_KEY\` |"
            echo "| new key authenticated | ${{ steps.validate.outcome }} |"
            echo "| running process holds it | ${{ steps.health.outputs.ok || 'no' }} |"
            echo
            echo "Revoke the old key in the Anthropic Console once Slack answers."
          } >> "$GITHUB_STEP_SUMMARY"
