[project]
name = "ricardi"
version = "0.1.0"
description = "A Slack proxy to Claude Code agents running on a box"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The Slack front end. Socket Mode dials out to Slack, so the box needs no
# inbound port and no public hostname.
slack = ["slack-bolt>=1.21", "aiohttp>=3.9"]
# The agent back end that owns its own Claude Code sessions.
sdk = ["claude-agent-sdk>=0.2.163"]

[project.scripts]
ricardi = "ricardi.cli:main"

[dependency-groups]
# pyyaml is for the workflow trust guard in tests/, not for the package.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ricardi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: spends real tokens against the Claude Agent SDK; opt in with RICARDI_LIVE=1",
]
