[project]
name = "ricardi"
version = "0.1.0"
description = "A Slack proxy to Claude Code agents running on a box"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gevik Nalbandian" }]
requires-python = ">=3.11"
# Nothing at all by default: the transport and the backend are both optional, so
# `pip install ricardi` pulls in no HTTP stack and no SDK until you say which
# halves you want. See [project.optional-dependencies].
dependencies = []

keywords = ["slack", "claude", "claude-code", "agents", "policy", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/gevikn/ricardi"
Source = "https://github.com/gevikn/ricardi"
Issues = "https://github.com/gevikn/ricardi/issues"
Security = "https://github.com/gevikn/ricardi/blob/main/SECURITY.md"

[project.optional-dependencies]
# The Slack front end. Socket Mode dials out to Slack, so the box needs no
# inbound port and no public hostname.
slack = ["slack-bolt>=1.21", "aiohttp>=3.9"]
# The agent back end that owns its own Claude Code sessions.
sdk = ["claude-agent-sdk>=0.2.163"]

[project.scripts]
ricardi = "ricardi.cli:main"

[dependency-groups]
# pyyaml is for the workflow trust guard in tests/, not for the package.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ricardi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Not ".". The repo root holds a `requests/` directory (the shared-session
# request files), and on sys.path that shadows the `requests` package as an
# empty namespace package -- so the day a dependency imports it, the failure
# is a ModuleNotFoundError inside third-party code rather than a clean "not
# installed". A test importing a helper from a sibling test module needs no
# entry here either: tests/ has no __init__.py, so pytest's default prepend
# import mode already puts it on sys.path, under bare `pytest` and
# `uv run pytest` alike. Import the sibling unqualified.
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: spends real tokens against the Claude Agent SDK; opt in with RICARDI_LIVE=1",
]
