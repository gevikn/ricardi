# Who may ask, and what the agent may then do.
#
# Copy to policy.toml and edit. Deny overrides allow, and anything no rule
# allows is denied -- including, deliberately, anything you forgot.
#
# A rule matches when every dimension it names matches. Dimensions it leaves
# out match everything, so a rule with only `tools` applies to every user,
# channel and agent. That is the thing to be careful about here: a rule that
# forgets to say who it is for grants more than it looks like it grants.
#
# Agents are repositories (see agents.example.toml), so `agents` in a rule
# means "in this checkout". Rules that grant change are written per repo for
# that reason -- "who may alter what, and where" reads off the file directly.
#
# None of this is the only line of defence. A person who wants to be sure
# nothing changes on a particular request says so when they ask, with `-ro`;
# `-dry` stops before running anything. Those subtract from whatever is below
# and can never add to it.

# ---------------------------------------------------------------- the ceiling
# How many turns one person may start. Each one spends money on this machine's
# account, so an allowlisted person in a loop is an expensive accident. Zero or
# absent means no ceiling.
#
# These bound how many turns there are; max_budget_usd in agents.toml bounds
# what one turn may cost. You want both.
[limits]
turns_per_minute = 4
turns_per_hour = 40

# ---------------------------------------------------------------- the roster
# Slack user id -> an email that is a label for humans and audit logs. This is
# the whole identity story: no directory lookups, so no extra Slack scopes, no
# reinstall, and nothing that can change under you without a reviewed diff.
#
# Find an id in Slack: click a profile -> More -> Copy member ID.
# The local stub's default user, so `--transport local` works before you have
# a Slack app. "local" can never be a Slack channel id (those start with C and
# are uppercase), so this grants nothing in Slack -- but delete both this and
# the rule below once you are past trying it out.
[[identity]]
slack = "tester"
email = "tester@localhost"

[[identity]]
slack = "U00000000000"
email = "you@example.com"

[[identity]]
slack = "U11111111111"
email = "them@example.com"

# ------------------------------------------------------------- who may ask
[[rule]]
name     = "the local stub, for trying it out before Slack exists"
effect   = "allow"
actions  = ["ask", "list"]
users    = ["tester@localhost"]
channels = ["local"]

[[rule]]
name     = "both of us, in the one channel we agreed on"
effect   = "allow"
actions  = ["ask", "list"]
users    = ["you@example.com", "them@example.com"]
channels = ["C00000000000"]          # the channel id, not its name

# Reaching a second repository is a second rule. Without one, everyone named
# above can address every agent in the catalogue.
# [[rule]]
# name     = "only one of us works on utils"
# effect   = "allow"
# actions  = ["ask"]
# agents   = ["utils"]
# users    = ["you@example.com"]
# channels = ["C00000000000"]

# ------------------------------------------------- what the agent may do
# Reading is the whole point of a question-and-answer agent, and it is the one
# thing that cannot change anything. It still has to be bounded. Without
# `path_under` this rule reaches every file you can open -- /etc/shadow,
# ~/.ssh, ~/.claude -- and the denies at the bottom of this file are a backstop
# for the paths someone thought of, not a boundary.
#
# Point it at the directory that holds the agents' working trees, so it covers
# every `cwd` in agents.toml and nothing above them.
#
# A tool that names no path at all -- `Grep` with a pattern and no `path` --
# cannot satisfy this rule and is denied. That is the right way round, and it is
# worth a line in the agent's system prompt: always name a path.
[[rule]]
name       = "read anything under the agents' worktrees"
effect     = "allow"
actions    = ["tool"]
tools      = ["Read", "Grep", "Glob", "NotebookRead"]
path_under = "~/experiments"

# Writing is confined three ways: to the people who agreed to it, to one
# repository, and to a path inside it. `users` is the one that used to be
# missing, and its absence meant this applied to everybody in every channel.
#
# `path_under` is still worth setting even though `agents` already pins the
# checkout: it is what stops a relative path or a symlink walking out of it.
[[rule]]
name       = "shared: the two of us may change this checkout"
effect     = "allow"
actions    = ["tool"]
agents     = ["shared"]
users      = ["you@example.com", "them@example.com"]
tools      = ["Write", "Edit", "NotebookEdit"]
path_under = "~/repos/shared"

# Running things is where you and the other engineer have to actually agree.
# Every allowed command announces itself in the thread before it runs, so the
# agreement is visible while there is still time to object.
# "shell" covers whichever shell tool the platform uses: Bash on macOS, Linux
# and WSL, PowerShell on Windows. Naming one of them directly covers nothing on
# the other, which is a quiet way to end up with no rule at all.
[[rule]]
name            = "shared: commands may be run here, and are announced"
effect          = "allow"
actions         = ["tool"]
agents          = ["shared"]
users           = ["you@example.com", "them@example.com"]
tools           = ["shell"]
obligations     = ["announce"]
command_matches = [
  "pytest*",
  "python -m pytest*",
  "python *",
  "uv run *",
  "git status*",
  "git diff*",
  "git log*",
  "ls *",
  "cat *",
  "dir *",
  "type *",
  "Get-Content *",
  "Get-ChildItem *",
]

# Deny wins over any allow above, whoever asks. These are the honest mistakes
# worth catching -- not a security boundary, because no list of command
# patterns survives $(...), pipes or a base64 payload. The allow patterns above
# are prefix-shaped, so "ls *" matches "ls -a && something-else" -- which is
# exactly why every pattern here is wrapped in stars on both sides, and why
# deny wins. The boundary is the checkout, the sandbox and the absence of push
# credentials.
# No `tools` here on purpose: a deny that names one shell would miss the other,
# and missing a deny is worse than missing an allow. Without it this matches any
# tool whose input carries a command.
[[rule]]
name            = "never, whoever asks"
effect          = "deny"
actions         = ["tool"]
command_matches = [
  "*git push*",
  "*git reset --hard*",
  "*git clean*",
  "*rm -rf*",
  "*curl*",
  "*wget*",
  "*pip install*",
  "*npm install*",
  "*ssh *",
  "*sudo*",
]

# Secrets are not read or written, by any tool, even inside an allowed path.
# Two rules because a shell command and a file path are different shapes.
#
# Write these wider than looks necessary. A pattern only catches the spelling
# you thought of: `*id_rsa*` misses `id_ed25519`, and `*/credentials*` misses
# `/.credentials.json`, because the leading dot is part of the name. Both of
# those were real holes here. Match the directory as well as the filename.
[[rule]]
name         = "no credential files, whichever tool asks"
effect       = "deny"
actions      = ["tool"]
path_matches = [
  "*/.env",
  "*/.env.*",
  "*/.ssh/*",
  "*id_rsa*",
  "*id_dsa*",
  "*id_ecdsa*",
  "*id_ed25519*",
  "*credential*",          # covers credentials, .credentials.json, .git-credentials
  "*/.aws/*",
  "*/.gh/*",
  "*/.config/gh/*",
  "*/.claude/*",           # the agent's own login lives here
  "*/.netrc",
  "*.pem",
  "*.pfx",
  "*.p12",
]

[[rule]]
name            = "nor by shelling out to read them"
effect          = "deny"
actions         = ["tool"]
command_matches = [
  "*.env*",
  "*.ssh*",
  "*id_rsa*",
  "*id_dsa*",
  "*id_ecdsa*",
  "*id_ed25519*",
  "*credential*",
  "*.aws*",
  "*.gh/*",
  "*.claude*",
  "*.netrc*",
  "*.pem*",
  "*.pfx*",
]
