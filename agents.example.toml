# Ricardi's agent catalogue. Copy to agents.toml and edit.
#
# Each [[agent]] becomes a name the humans in Slack can address. The names are
# declared rather than discovered on purpose: a fixed list gives the channel
# stable names, and pins each agent's working directory rather than leaving it
# to whoever is typing.
#
# What an agent may *do* is not here. Tool permissions live in policy.toml, so
# one reviewed file grants everything.

[ricardi]
# Work in silence for this long before telling the channel we are on it.
ack_after = 4.0
# Where thread-to-agent bindings and the audit log are kept.
# state_dir = "./state"

# One agent per repository, named after the repository.
#
# An earlier version of this file split agents by permission instead -- a
# read-only one and a writing one -- and that was the wrong axis. Whether a
# question needs to write is not something the asker knows: "summarise what
# this repo does" sounds read-only and needs `ls`, `cat` and `git log`. Which
# repository they mean is something they do know, before they type anything.
#
# So the agent carries what is knowable in advance -- the checkout and the
# budget -- and policy.toml decides who may change what. Anyone who wants to
# guarantee nothing changes says so per request, with `-ro`.
#
# Point `cwd` at a checkout with no push credentials, so what it can reach is
# decided by the filesystem and not only by policy. For example:
#
#   git worktree add ~/repos/shared -b shared
#
[[agent]]
name = "shared"
description = "the repository we are both working in"
# Ceilings the SDK enforces on every turn. On a machine left running, "no
# limit" should be something you chose rather than something you forgot. Both
# numbers are per turn, not per day.
max_budget_usd = 2.00
max_turns = 60
cwd = "~/repos/shared"
system_prompt = """
You work on this repository for a Slack channel with a few engineers in it.
Be brief: two or three sentences unless asked for more. Say plainly when you
do not know rather than guessing.

Everything you do stays inside this checkout. If something you need is not
permitted, say so and stop rather than looking for another way around.
"""

# A second repository is a second block. Nothing else changes: a name, a
# checkout, a budget. Who may reach it, and who may change it, are rules in
# policy.toml keyed on this name.
#
# [[agent]]
# name = "utils"
# description = "the scripts repo"
# max_budget_usd = 1.00
# max_turns = 40
# cwd = "~/repos/utils"
