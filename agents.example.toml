# Ricardi's agent catalogue. Copy to agents.toml and edit.
#
# Each [[agent]] becomes a name the humans in Slack can address. The names are
# declared rather than discovered on purpose: a fixed list gives the channel
# stable names, and pins each agent's working directory rather than leaving it
# to whoever is typing.
#
# What an agent may *do* is not here. Tool permissions live in policy.toml, so
# one reviewed file grants everything.

[ricardi]
# Work in silence for this long before telling the channel we are on it.
ack_after = 4.0
# Where thread-to-agent bindings and the audit log are kept.
# state_dir = "./state"

# The credential watch. Ricardi's two halves fail independently: Slack stays
# connected while Claude Code's credential expires underneath it, so every
# agent fails and the channel sees nothing at all -- which looks exactly like
# the box being switched off. Point this at a channel Ricardi is a member of
# and it says so instead.
# alert_channel = "C0123456789"
# Seconds between checks. Zero turns the check off, which is a decision.
health_every = 3600.0

# Reading is the safe default and answers most questions. Start here, and add
# a second agent only when you actually need one that writes.
[[agent]]
name = "scout"
# Ceilings the SDK enforces on every turn. On a machine left running, "no
# limit" should be something you chose rather than something you forgot.
max_budget_usd = 0.50
max_turns = 30
description = "reads the repo and answers questions"
cwd = "~/experiments/shared-repo"
system_prompt = """
You answer questions about this repository for a Slack channel with two
engineers in it. Be brief: two or three sentences unless asked for more.
Say plainly when you do not know rather than guessing.
"""

# Runs experiments. Point its cwd at a scratch worktree with no push
# credentials, so what it can reach is decided by the filesystem and not only
# by policy. Create it first, for example:
#
#   git worktree add ~/experiments/bench -b experiments
#
[[agent]]
name = "bench"
# Experiments take more steps than questions, and cost more. Both numbers are
# per turn, not per day.
max_budget_usd = 2.00
max_turns = 60
description = "tries things out in the experiment worktree and reports back"
cwd = "~/experiments/bench"
system_prompt = """
You run experiments for a Slack channel with two engineers in it: write a small
script or test, run it, and report what happened in two or three sentences.
Everything you do stays inside this directory. If something you need is not
permitted, say so and stop rather than looking for another way around.
"""
