# Paste this into https://api.slack.com/apps -> Create New App -> From an app
# manifest. It sets the scopes, the events and Socket Mode in one go, so there
# is no request URL to configure and no port to expose.
#
# Two tokens still have to be generated by hand afterwards; see README.md.
display_information:
  name: Ricardi
  description: Proxy to the Claude Code agents running on a box
  background_color: "#3d20ff"
  long_description: |
    Ricardi carries messages between a Slack channel and Claude Code agents
    running on a machine you control. Ask her to list the agents she can reach,
    then address one by name. Once a thread is talking to an agent, replying in
    that thread is enough.

features:
  bot_user:
    display_name: ricardi
    always_online: true

oauth_config:
  scopes:
    bot:
      # Hear @ricardi in a channel.
      - app_mentions:read
      # Answer.
      - chat:write
      # Read thread replies, so a bound thread keeps working without a mention.
      # channels:* is public channels, groups:* is private ones.
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  # The point of Socket Mode: Ricardi dials out, so the box needs no public
  # hostname, no inbound port and no request-signature checking.
  socket_mode_enabled: true
  token_rotation_enabled: false
