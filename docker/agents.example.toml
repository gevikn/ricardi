# Ricardi's agent catalogue, for the container.
#
# Paths are container paths. /workspace is whatever compose.yaml mounts there
# ($RICARDI_WORKSPACE, ./workspace by default), so a host path never appears
# here and the same file works on any host.

[ricardi]
ack_after = 4.0
state_dir = "/app/state"

# The credential watch. Ricardi's two halves fail independently: Slack stays
# connected while Claude Code's credential expires underneath it, so every
# agent fails and the channel sees nothing at all -- which looks exactly like
# the box being switched off. Point this at a channel Ricardi is a member of
# and it says so instead.
# alert_channel = "C0123456789"
# Seconds between checks. Zero turns the check off, which is a decision.
health_every = 3600.0

# One agent per repository, named after the repository.
#
# An earlier version of this file split agents by permission instead -- a
# read-only one and a writing one -- and that was the wrong axis. Whether a
# question needs to write is not something the asker knows: "summarise what
# this repo does" sounds read-only and needs `ls`, `cat` and `git log`. Which
# repository they mean is something they do know, before they type anything.
#
# So the agent carries what is knowable in advance -- the checkout and the
# budget -- and policy.toml decides who may change what. A person who wants to
# guarantee nothing changes says so per request, with `-ro`.

[[agent]]
name = "ricardi"
description = "this repository"
cwd = "/workspace/ricardi"
max_budget_usd = 2.00
max_turns = 60
system_prompt = """
You work on this repository for a Slack channel with a few engineers in it.
Be brief: two or three sentences unless asked for more. Say plainly when you
do not know rather than guessing.

Everything you do stays inside this checkout. If something you need is not
permitted, say so and stop rather than looking for another way around.
"""

# A second repository is a second block. Nothing else changes: give it a name,
# a checkout under /workspace, and a budget. Who may reach it, and who may
# change it, are rules in policy.toml keyed on this name.
#
# [[agent]]
# name = "utils"
# description = "the scripts repo"
# cwd = "/workspace/utils"
# max_budget_usd = 1.00
# max_turns = 40
